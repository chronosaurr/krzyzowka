<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krzyżówka</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <div class="main-wrapper">
        <div class="container">
            
            <div class="dropdown-container">
                <div class="dropdown-tag">
                    <span class="dropdown-icon">▼</span>
                    Krzyżówka
                </div>
                <div class="dropdown-content">
                    <button id="btn-normal" class="dropdown-btn">Losuj (Normalny)</button>
                    <button id="btn-hard" class="dropdown-btn">Losuj (Trudny)</button>
                </div>
            </div>

            <div class="clues-container">
                <div class="clues-column across">
                    <h2>Hasła poziomo</h2>
                    <ul id="clues-across"></ul>
                </div>
                <div class="clues-column down">
                    <h2>Hasła pionowe</h2>
                    <ul id="clues-down"></ul>
                </div>
            </div>

            <div class="timer-container">
                <span class="timer-label">CZAS GRY:</span>
                <span id="timer-display">00:00</span>
            </div>

            <div class="board" id="board"></div>

            <div class="verify-button-wrapper">
                <button id="verify-btn" class="btn-verify">Sprawdź odpowiedzi</button>
            </div>
        </div>
    </div>

    <div id="success-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button id="close-modal-btn" class="modal-close">&times;</button>
            <div class="modal-body">
                <span class="modal-icon">🎉</span>
                <h2>Gratulacje!</h2>
                <p id="success-text">Rozwiązałeś całą krzyżówkę bezbłędnie!</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
